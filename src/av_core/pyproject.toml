[project]
name = "av-core"
version = "0.1.0"
description = "Pure-Python (no ROS) types, control, planning, prediction, geometry and sweep code"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
# Legacy numpy pymdp (1.x is JAX-based). Needed only by av_core.plan.aif.
aif = ["inferactively-pymdp==0.0.7.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["av_core"]
