[project]
name = "av-core"
version = "0.1.0"
description = "Pure-Python (no ROS) types, control, planning, prediction, geometry and sweep code"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["av_core"]
