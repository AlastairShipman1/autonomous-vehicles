[project]
name = "autonomous-vehicles"
version = "0.1.0"
description = "Laptop-side autonomous driving stack: av_core, toy occlusion sim, tooling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["av-core", "av-sim-toy"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "mcap>=1.2",
    "mcap-ros2-support>=0.5",
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["av_core", "av_sim_toy"]

[tool.uv.sources]
av-core = { workspace = true }
av-sim-toy = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = ["slow: long-running tests, run with -m slow"]

[tool.pyright]
include = ["av_core", "av_sim_toy", "tools"]
exclude = ["**/.venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingParameterType = "error"
reportUnknownParameterType = "error"

[tool.ruff.lint]
# ANN401 bans explicit `Any`; ANN001/002/003 require annotations on parameters.
select = ["ANN001", "ANN002", "ANN003", "ANN401", "PGH003", "TID251"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # fixtures and test helpers are left unannotated
# Only the ROS and CARLA tiers may import ROS / CARLA; everything else must run on a bare laptop.
"**/av_ros/**" = ["TID251"]
"**/av_carla/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"rclpy".msg = "ROS is desktop-only: import it from av_ros only."
"rosbag2_py".msg = "ROS is desktop-only: import it from av_ros only."
"carla".msg = "CARLA is desktop-only: import it from av_carla only."
