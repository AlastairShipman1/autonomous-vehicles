[project]
name = "av-sim-toy"
version = "0.1.0"
description = "2D occlusion toy simulator: a pedestrian hidden behind a parked vehicle"
requires-python = ">=3.12"
dependencies = ["av-core", "numpy>=1.26", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["av_sim_toy"]

[tool.uv.sources]
av-core = { workspace = true }
